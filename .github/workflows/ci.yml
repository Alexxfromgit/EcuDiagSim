name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtserialbus qtserialport
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (warnings as errors)
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Start the app and take a screenshot
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software # runners have no GPU
        run: |
          $p = Start-Process build/ci/EcuDiagSim.exe -ArgumentList '--scenario','1','--tab','2','--speed','4','--after','6000','--screenshot','screenshot.png' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'the app did not quit' }
          if ($p.ExitCode -ne 0) { throw "the app exited with $($p.ExitCode)" }
          if (-not (Test-Path screenshot.png)) { throw 'no screenshot written' }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # The same packaging as a release: Setup.exe, portable zip, update package. Then install
      # silently and start the installed app.
      - name: Pack with Velopack and install
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(EcuDiagSim VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          python scripts/package.py --preset ci --version $version --out dist
          if ($LASTEXITCODE) { throw 'packaging failed' }
          $dir = Join-Path $env:RUNNER_TEMP 'ecusim'
          $shot = Join-Path $env:RUNNER_TEMP 'installed.png'
          $setup = Start-Process dist/EcuDiagSim-win-x64-Setup.exe -PassThru -Wait `
                     -ArgumentList '--silent', '--installto', $dir, '--', '--after', '4000', '--screenshot', $shot
          if ($setup.ExitCode -ne 0) { throw "Setup.exe exited with $($setup.ExitCode)" }
          for ($i = 0; $i -lt 60 -and -not (Test-Path $shot); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $shot)) { throw 'the installed app did not start' }
          Copy-Item $shot installed.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-windows
          path: |
            screenshot.png
            installed.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: EcuDiagSim-win-x64
          path: |
            dist/EcuDiagSim-win-x64-Setup.exe
            dist/EcuDiagSim-win-x64-Portable.zip
          retention-days: 14

  macos:
    name: macOS / Clang
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: brew install ninja || true

      - uses: jurplel/install-qt-action@v4
        timeout-minutes: 10
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialbus qtserialport
          cache: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Configure (warnings as errors)
        run: cmake --preset ci -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Pack with Velopack and start the packed app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          version=$(sed -nE 's/^project\(EcuDiagSim VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          python3 scripts/package.py --preset ci --version "$version" --channel osx-arm64 --out dist
          mkdir -p "$RUNNER_TEMP/app"
          ditto -x -k dist/EcuDiagSim-osx-arm64-Portable.zip "$RUNNER_TEMP/app"
          app=$(find "$RUNNER_TEMP/app" -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          perl -e 'alarm shift; exec @ARGV' 120 "$app/Contents/MacOS/EcuDiagSim" --scenario 1 --speed 4 --after 6000 --screenshot macos.png
          test -s macos.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos
          path: |
            macos.png
            dist/EcuDiagSim-osx-arm64-Setup.pkg
            dist/EcuDiagSim-osx-arm64-Portable.zip
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux / GCC (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Only what the build and the tests need (the same set as in the README's Linux section).
      # Short timeouts and retries; if the runner's Ubuntu mirror is unreachable the job still
      # builds and tests everything except the GUI executable (see Configure).
      - name: Install build tools
        id: apt
        continue-on-error: true
        timeout-minutes: 3 # a healthy mirror needs ~15 s
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 libdbus-1-3

      - name: Ninja without apt
        if: steps.apt.outcome != 'success'
        run: command -v ninja || pipx install ninja || python3 -m pip install --user ninja

      - uses: jurplel/install-qt-action@v4
        timeout-minutes: 10
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialbus qtserialport
          cache: true
          # Its own dependency install pulls ~40 multimedia packages we do not need and is
          # what hung for 18 minutes when the apt mirror was down. Ours above is enough.
          install-deps: 'false'

      - name: Configure
        env:
          APT_OK: ${{ steps.apt.outcome == 'success' }}
        run: |
          if [ "$APT_OK" = true ]; then
            cmake --preset asan
          else
            echo "::warning title=GUI app not built::The Ubuntu package mirror was unreachable, so the OpenGL/xkbcommon headers are missing. Core library and all tests are built and run; the Qt Quick executable is skipped."
            cmake --preset asan -DECUSIM_BUILD_APP=OFF
          fi

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=0

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # actionlint also runs shellcheck on every run: block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
